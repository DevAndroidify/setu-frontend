# Included in each location that sets its own headers (nginx drops inherited add_header
# lines as soon as a location adds one). The app loads nothing from other origins.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
